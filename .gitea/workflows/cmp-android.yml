name: CMP Android

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  fast-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install locked Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Verify project
        run: bash ./gradlew animeCheck --no-daemon --no-configuration-cache

      - name: Build demo APK
        run: bash ./gradlew :app:android:assembleDemoDebug --no-daemon --no-configuration-cache

      - name: Upload demo APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-demo-debug
          path: app/android/build/outputs/apk/demo/debug/android-demo-debug.apk
          if-no-files-found: error
