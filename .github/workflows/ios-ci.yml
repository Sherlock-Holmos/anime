name: iOS CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iOS Simulator build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build Kotlin iOS framework
        run: ./gradlew :shared:app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build SwiftUI host without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-xcodebuild.log

      - name: Launch application in iOS Simulator
        run: |
          set -euo pipefail
          app_path='build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app'
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable == true and (.name | startswith("iOS"))) | .identifier' | tail -1)
          device_type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name | startswith("iPhone")) | .identifier' | head -1)
          test -n "$runtime_id"
          test -n "$device_type"
          device_id=$(xcrun simctl create 'Anime CI' "$device_type" "$runtime_id")
          cleanup() {
            xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$device_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$device_id"
          simulator_ready=false
          for _ in $(seq 1 90); do
            if xcrun simctl getenv "$device_id" HOME >/dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            sleep 2
          done
          if [ "$simulator_ready" != true ]; then
            echo 'iOS Simulator did not become ready within 180 seconds.' >&2
            exit 1
          fi
          xcrun simctl install "$device_id" "$app_path"
          xcrun simctl launch "$device_id" site.jokersh.anime
          sleep 12
          if ! xcrun simctl spawn "$device_id" ps -ax | grep -q '/iosApp.app/iosApp'; then
            xcrun simctl spawn "$device_id" log show \
              --last 2m \
              --style compact \
              --predicate 'process == "iosApp" OR eventMessage CONTAINS "site.jokersh.anime"' \
              > build/ios-simulator-launch.log || true
            mkdir -p build/ios-crash-reports
            find "$HOME/Library/Logs/DiagnosticReports" \
              -type f \( -name 'iosApp*.ips' -o -name 'iosApp*.crash' \) \
              -mmin -10 \
              -exec cp {} build/ios-crash-reports/ \; || true
            echo '--- unified simulator log ---'
            cat build/ios-simulator-launch.log
            exit 1
          fi
          xcrun simctl terminate "$device_id" site.jokersh.anime

      - name: Upload simulator application and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-simulator-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app
            build/ios-xcodebuild.log
            build/ios-simulator-launch.log
            build/ios-crash-reports

  unsigned-ipa:
    name: Unsigned iOS device IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Kotlin iOS device framework
        run: ./gradlew :shared:app:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Build unsigned iOS device application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build/ios-device-xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path='build/ios-device-derived-data/Build/Products/Release-iphoneos/iosApp.app'
          package_dir='build/ios-device-package'
          test -d "$app_path"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/iosApp.app"
          rm -rf "$package_dir/Payload/iosApp.app/_CodeSignature"
          rm -f "$package_dir/Payload/iosApp.app/embedded.mobileprovision"
          plutil -p "$package_dir/Payload/iosApp.app/Info.plist"
          file "$package_dir/Payload/iosApp.app/iosApp"
          if nm -u "$package_dir/Payload/iosApp.app/iosApp" | grep -q 'UIViewLayoutRegion'; then
            echo 'The application links the iOS 26-only UIViewLayoutRegion symbol.' >&2
            echo 'This binary would crash at launch on supported iOS 17-25 devices.' >&2
            exit 1
          fi
          (
            cd "$package_dir"
            zip -qry '../Anime-unsigned.ipa' Payload
          )
          test -s build/Anime-unsigned.ipa

      - name: Upload unsigned IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-unsigned-ipa-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/Anime-unsigned.ipa
            build/ios-device-xcodebuild.log
