name: iOS CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iOS Simulator build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build Kotlin iOS framework
        run: ./gradlew :shared:app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build SwiftUI host without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-xcodebuild.log

      - name: Launch application in iOS Simulator
        run: |
          set -euo pipefail
          app_path='build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app'
          bundle_id='site.jokersh.anime'
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable == true and (.name | startswith("iOS"))) | .identifier' | tail -1)
          device_type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name | startswith("iPhone")) | .identifier' | head -1)
          test -n "$runtime_id"
          test -n "$device_type"
          device_id=$(xcrun simctl create 'Anime CI' "$device_type" "$runtime_id")
          cleanup() {
            xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$device_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          perl -e 'alarm 60; exec @ARGV' -- xcrun simctl boot "$device_id"
          simulator_ready=false
          for _ in $(seq 1 60); do
            if perl -e 'alarm 3; exec @ARGV' -- \
              xcrun simctl getenv "$device_id" HOME >/dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            sleep 2
          done
          if [ "$simulator_ready" != true ]; then
            echo 'iOS Simulator did not become ready within 120 seconds.' >&2
            exit 1
          fi
          perl -e 'alarm 60; exec @ARGV' -- xcrun simctl install "$device_id" "$app_path"
          # Scroll the discover page after data arrives so the artifact captures the real
          # system soft-edge blur instead of only the untouched launch position.
          launch_output=''
          app_pid=''
          launch_status=1
          for attempt in 1 2 3; do
            set +e
            launch_output=$(perl -e 'alarm 30; exec @ARGV' -- \
              xcrun simctl launch "$device_id" "$bundle_id" -- --ci-scroll-edge-preview \
              2>&1 | tee -a build/ios-simulator-launch.log)
            launch_status=$?
            set -e
            app_pid=$(echo "$launch_output" | awk '{print $2}')
            if [ "$launch_status" -eq 0 ] && [ -n "$app_pid" ]; then
              break
            fi
            echo "simctl launch attempt $attempt failed (status $launch_status); retrying." \
              | tee -a build/ios-simulator-launch.log
            sleep 3
          done
          test "$launch_status" -eq 0
          test -n "$app_pid"
          # CoreSimulator's launchctl service queries are not reliable on hosted
          # macOS runners and can block the workflow indefinitely. Keep the app
          # alive long enough to exercise the first frame and native startup, then
          # capture the screen and crash reports for inspection.
          sleep 20
          : > build/ios-simulator-runtime.log
          : > build/ios-simulator-process.log
          : > build/ios-simulator-crash.log
          : > build/ios-simulator-terminate.log
          : > build/ios-simulator-screenshot.log
          mkdir -p build/ios-crash-reports
          simulator_data="$HOME/Library/Developer/CoreSimulator/Devices/$device_id/data"
          find "$HOME/Library/Logs/DiagnosticReports" "$simulator_data/Library/Logs/CrashReporter" \
            -maxdepth 2 -type f -name '*iosApp*' -mmin -10 -exec cp {} build/ios-crash-reports/ \; 2>/dev/null || true
          # Hosted CoreSimulator can occasionally leave `simctl io` blocked even after
          # the image has been produced. Keep artifact collection bounded so a real app
          # crash report can still be uploaded instead of hiding behind a hung command.
          if ! perl -e 'alarm 15; exec @ARGV' -- \
            xcrun simctl io "$device_id" screenshot build/ios-simulator.png \
            > build/ios-simulator-screenshot.log 2>&1; then
            echo 'Simulator screenshot command timed out or failed; continuing with crash artifacts.' \
              | tee -a build/ios-simulator-screenshot.log
          fi

      - name: Upload simulator application and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-simulator-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app
            build/ios-xcodebuild.log
            build/ios-simulator-launch.log
            build/ios-simulator-process.log
            build/ios-simulator-crash.log
            build/ios-simulator-runtime.log
            build/ios-simulator-terminate.log
            build/ios-simulator-screenshot.log
            build/ios-simulator.png
            build/ios-crash-reports

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-screenshot-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: build/ios-simulator.png

  unsigned-ipa:
    name: Unsigned iOS device IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Kotlin iOS device framework
        run: ./gradlew :shared:app:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Build unsigned iOS device application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build/ios-device-xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path='build/ios-device-derived-data/Build/Products/Release-iphoneos/iosApp.app'
          package_dir='build/ios-device-package'
          test -d "$app_path"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/iosApp.app"
          rm -rf "$package_dir/Payload/iosApp.app/_CodeSignature"
          rm -f "$package_dir/Payload/iosApp.app/embedded.mobileprovision"
          plutil -p "$package_dir/Payload/iosApp.app/Info.plist"
          file "$package_dir/Payload/iosApp.app/iosApp"
          (
            cd "$package_dir"
            zip -qry '../Anime-unsigned.ipa' Payload
          )
          test -s build/Anime-unsigned.ipa

      - name: Upload unsigned IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-unsigned-ipa-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/Anime-unsigned.ipa
            build/ios-device-xcodebuild.log
