name: iOS CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    name: iOS Simulator build
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build Kotlin iOS framework
        run: ./gradlew :shared:app:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build SwiftUI host without signing
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build/ios-xcodebuild.log

      - name: Launch application in iOS Simulator
        run: |
          set -euo pipefail
          app_path='build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app'
          bundle_id='site.jokersh.anime'
          runtime_id=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable == true and (.name | startswith("iOS"))) | .identifier' | tail -1)
          device_type=$(xcrun simctl list devicetypes -j | jq -r '.devicetypes[] | select(.name | startswith("iPhone")) | .identifier' | head -1)
          test -n "$runtime_id"
          test -n "$device_type"
          device_id=$(xcrun simctl create 'Anime CI' "$device_type" "$runtime_id")
          cleanup() {
            xcrun simctl shutdown "$device_id" >/dev/null 2>&1 || true
            xcrun simctl delete "$device_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          xcrun simctl boot "$device_id"
          simulator_ready=false
          for _ in $(seq 1 90); do
            if xcrun simctl getenv "$device_id" HOME >/dev/null 2>&1; then
              simulator_ready=true
              break
            fi
            sleep 2
          done
          if [ "$simulator_ready" != true ]; then
            echo 'iOS Simulator did not become ready within 180 seconds.' >&2
            exit 1
          fi
          xcrun simctl install "$device_id" "$app_path"
          bounded_output() {
            local output_file="$1"
            shift
            set +e
            perl -e 'alarm 15; exec @ARGV' -- "$@" > "$output_file" 2>&1
            local command_status=$?
            set -e
            return "$command_status"
          }
          # Scroll the discover page after data arrives so the artifact captures the real
          # system soft-edge blur instead of only the untouched launch position.
          set +e
          perl -e 'alarm 30; exec @ARGV' -- xcrun simctl launch "$device_id" "$bundle_id" --ci-scroll-edge-preview > build/ios-simulator-launch.log 2>&1
          launch_status=$?
          set -e
          if [ "$launch_status" -ne 0 ]; then
            cat build/ios-simulator-launch.log >&2 || true
            echo "iOS Simulator launch command failed or timed out." >&2
            exit 1
          fi
          cat build/ios-simulator-launch.log
          launch_output=$(cat build/ios-simulator-launch.log)
          test -n "$launch_output"
          app_pid=$(echo "$launch_output" | awk '{print $2}')
          test -n "$app_pid"
          # CoreSimulator's launchctl service queries are not reliable on hosted
          # macOS runners and can block the workflow indefinitely. Keep the app
          # alive long enough to exercise the first frame and native startup, then
          # use simctl terminate as the direct liveness assertion below.
          sleep 20
          bounded_output build/ios-simulator-runtime.log \
            xcrun simctl spawn "$device_id" log show \
            --style compact \
            --last 3m \
            --predicate 'process == "iosApp"' || true
          cp build/ios-simulator-runtime.log build/ios-simulator-process.log
          bounded_output build/ios-simulator-crash.log \
            xcrun simctl spawn "$device_id" log show \
            --style compact \
            --last 5m \
            --predicate 'process == "iosApp" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "exception"' || true
          mkdir -p build/ios-crash-reports
          simulator_home=$(xcrun simctl getenv "$device_id" HOME)
          find "$HOME/Library/Logs/DiagnosticReports" "$simulator_home/Library/Logs/CrashReporter" \
            -maxdepth 2 -type f -name '*iosApp*' -mmin -10 -exec cp {} build/ios-crash-reports/ \; 2>/dev/null || true
          if ! bounded_output build/ios-simulator-screenshot.log \
            xcrun simctl io "$device_id" screenshot build/ios-simulator.png; then
            cat build/ios-simulator-screenshot.log >&2 || true
            echo 'Unable to capture the iOS Simulator screenshot.' >&2
            exit 1
          fi
          set +e
          bounded_output build/ios-simulator-terminate.log \
            xcrun simctl terminate "$device_id" "$bundle_id"
          terminate_status=$?
          set -e
          if [ "$terminate_status" -ne 0 ]; then
            echo "iOS app crashed or was terminated during the 20-second runtime soak (pid $app_pid)." >&2
            cat build/ios-simulator-terminate.log >&2 || true
            tail -200 build/ios-simulator-runtime.log >&2 || true
            exit 1
          fi

      - name: Upload simulator application and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-simulator-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/ios-derived-data/Build/Products/Debug-iphonesimulator/iosApp.app
            build/ios-xcodebuild.log
            build/ios-simulator-launch.log
            build/ios-simulator-process.log
            build/ios-simulator-crash.log
            build/ios-simulator-runtime.log
            build/ios-simulator-terminate.log
            build/ios-simulator-screenshot.log
            build/ios-simulator.png
            build/ios-crash-reports

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-screenshot-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: build/ios-simulator.png

  unsigned-ipa:
    name: Unsigned iOS device IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build Kotlin iOS device framework
        run: ./gradlew :shared:app:linkReleaseFrameworkIosArm64 --stacktrace

      - name: Build unsigned iOS device application
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project app/iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios-device-derived-data \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build/ios-device-xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path='build/ios-device-derived-data/Build/Products/Release-iphoneos/iosApp.app'
          package_dir='build/ios-device-package'
          test -d "$app_path"
          rm -rf "$package_dir"
          mkdir -p "$package_dir/Payload"
          ditto "$app_path" "$package_dir/Payload/iosApp.app"
          rm -rf "$package_dir/Payload/iosApp.app/_CodeSignature"
          rm -f "$package_dir/Payload/iosApp.app/embedded.mobileprovision"
          plutil -p "$package_dir/Payload/iosApp.app/Info.plist"
          file "$package_dir/Payload/iosApp.app/iosApp"
          (
            cd "$package_dir"
            zip -qry '../Anime-unsigned.ipa' Payload
          )
          test -s build/Anime-unsigned.ipa

      - name: Upload unsigned IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anime-ios-unsigned-ipa-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/Anime-unsigned.ipa
            build/ios-device-xcodebuild.log
