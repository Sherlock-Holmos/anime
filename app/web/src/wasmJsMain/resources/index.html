<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111318">
    <link rel="icon" href="data:,">
    <title>Anime</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #111318;
        }

        #loading {
            box-sizing: border-box;
            display: grid;
            min-height: 100%;
            place-content: center;
            gap: 12px;
            padding: 24px;
            color: #e7e8f1;
            font: 16px/1.5 system-ui, sans-serif;
            text-align: center;
        }

        #loading strong {
            color: #b8b8ff;
            font-size: 28px;
        }

        body:has(canvas) #loading {
            display: none;
        }
    </style>
</head>
<body>
    <main id="loading">
        <strong>Anime</strong>
        <span id="loading-message">正在加载 Web 应用…</span>
    </main>
    <script>
        if (window.location.protocol === "file:") {
            document.getElementById("loading-message").textContent =
                "不能直接打开此源码文件，请运行 Gradle Web 开发服务器。";
        }
    </script>
    <script src="anime.js"></script>
</body>
</html>
